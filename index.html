<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="description" content="Undercards Card Creator & Editor">
    <meta property="og:title" content="Undercards Card Editor">
    <meta property="og:description" content="Create Undercards cards here! (by @sernon158)">
    <meta property="og:image" content="./Undercards/favicon.ico">
    <link rel="icon" type="image/png" href="./Undercards/favicon.ico">
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link href="./css/bootstrap-dialog.min.css" rel="stylesheet">
    <link href="./css/uc-decks.css" rel="stylesheet">
    <link href="./css/uc-cards.css" rel="stylesheet">
    <link href="./css/frames.css" rel="stylesheet">
    <link href="./css/card.css" rel="stylesheet">
    <link href="./css/artifact.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
    <title>Undercards Card Editor</title>
</head>

<body>
    <main></main>

    <footer>
        <div class="left-side">
            <span id="create-group">Create New Group</span>
        </div>
        <div class="center">Card editor by Sernon158</div>
        <div class="right-side">
            <span id="open-settings">
                <img src="./Undercards/SETTINGS.png" width="16" height="16">
                Settings
            </span>
        </div>
    </footer>

    <div id="contextmenu" style="left: 0; top: 0; display: none;" data-current-card="">
        <span onclick="cloneCard(this)">Clone Card</span>
        <hr>
        <span onclick="downloadCard(this)">Download Card</span>
        <hr>
        <span onclick="deleteCard(this)">Delete Card</span>
        <hr>
        <span onclick="changeFrameDialog(this)">Change frame</span>
        <hr>
        <span onclick="toggleEditButtons(this)" style="font-size: 11.5px;">
            Toggle <img src="./Undercards/ADD.png" style="width: 16px; filter: drop-shadow(0px 0px 2px gray);"> Buttons
        </span>
    </div>

    <div id="contextmenu-artifact" style="left: 0; top: 0; display: none;" data-current-artifact="">
        <span onclick="toggleArtifactRarity(this)" style="font-size: 12px;">Toggle Artifact Rarity</span>
        <hr>
        <span onclick="deleteArtifact(this)">Delete Artifact</span>
    </div>

    <script>
        const VERSION = "?v=36";
    </script>

    <script src="./js/3rdparty/jquery.min.js?v=36"></script>
    <script src="./js/3rdparty/jquery.livequery.min.js?v=36"></script>
    <script src="./js/3rdparty/bootstrap.min.js?v=36" type="text/javascript"></script>
    <script src="./js/3rdparty/bootstrap-dialog.min.js?v=36" type="text/javascript"></script>
    <script src="./js/3rdparty/jquery-i18n.min.js?v=36"></script>
    <script src="./js/3rdparty/dom-to-image.min.js?v=36"></script>
    <script src="./js/3rdparty/popper-js.min.js?v=36"></script>
    <script src="./js/3rdparty/tippy.min.js?v=36"></script>

    <script src="./data/allCards.js"></script>
    <script src="./data/artifacts.js"></script>
    <script src="./data/enchants.js"></script>
    <script src="./data/translation/en.js"></script>

    <script src="./js/utils.js?v=36"></script>
    <script src="./js/data.js?v=36"></script>
    <script src="./js/setupTippy.js?v=36"></script>
    <script src="./js/uc-translations.js?v=36"></script>
    <script src="./js/check.js?v=36"></script>
    <script src="./js/create.js?v=36"></script>
    <script src="./js/createArtifact.js?v=36"></script>
    <script src="./js/download.js?v=36"></script>
    <script src="./js/templateCards.js?v=36"></script>
    <script src="./js/settings.js?v=36"></script>
    <script src="./js/createTemplates.js?v=36"></script>
    <script src="./js/group.js?v=36"></script>
    <script src="./js/save.js?v=36"></script>
    <script src="./js/dragging.js?v=36"></script>
    <script src="./js/main.js?v=36"></script>
</body>
</html>
